max_retry: 2
memory_enabled: false
timeout_s: 60
hitl:
  enabled: false

# Anomaly classification thresholds (can be overridden via operator_config)
thresholds:
  degraded_pct: 10.0
  critical_pct: 25.0
  outage_pct: 50.0
  error_rate_critical_pct: 5.0
  error_rate_outage_pct: 10.0
  availability_outage_pct: 99.0

# Runbook KB (leave blank to disable)
runbook_kb_url: ""
runbook_kb_top_k: 3
runbook_kb_allowed_hosts: []

# LLM defaults
llm:
  model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 1024

# Escalation channels (informational — caller routes based on escalation_required flag)
escalation_channels:
  - pagerduty
  - slack
